<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RECAP — Project Status Report</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    /* Report color palette */
    :root {
      --bg: #f7f4f1;
      --surface: #ffffff;
      --border: #e8e0d8;
      --primary: #401938;
      --primary-light: #f5eff3;
      --accent: #f58962;
      --accent-light: #fdf1eb;
      --forest: #193837;
      --beige: #e1d1c1;
      --success: #193837;
      --warning: #d93b0b;
      --danger: #b91c1c;
      --text: #1e1018;
      --muted: #7a6570;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(64, 25, 56, .08);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }

    h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
    }

    h2 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    h3 {
      font-family: 'Nunito', sans-serif;
      font-size: .95rem;
      font-weight: 700;
    }

    p {
      color: var(--muted);
      font-size: .875rem;
    }

    /* Header */
    header {
      background: var(--primary);
      border-bottom: none;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-meta {
      font-size: .8rem;
      color: rgba(255, 255, 255, .65);
      margin-top: 2px;
    }

    header h1 {
      color: #ffffff;
      font-family: 'Nunito', sans-serif;
    }

    .sprint-badge {
      background: var(--accent);
      color: #ffffff;
      font-size: .75rem;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 20px;
      white-space: nowrap;
      font-family: 'Nunito', sans-serif;
    }

    /* RECAP wordmark top-right */
    .recap-wordmark {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      color: #ffffff;
      letter-spacing: -.02em;
      margin-left: 16px;
      flex-shrink: 0;
    }

    /* Tab bar */
    .tab-bar {
      background: var(--surface);
      border-bottom: 2px solid var(--beige);
      padding: 0 32px;
      display: flex;
      gap: 2px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 12px 16px;
      font-size: .82rem;
      font-weight: 500;
      color: var(--muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
      font-family: 'DM Sans', sans-serif;
    }

    .tab-btn:hover {
      color: var(--primary);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    main {
      padding: 28px 32px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* KPI row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow);
    }

    .kpi-label {
      font-size: .72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 1.5rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
    }

    .kpi-value.ok {
      color: var(--forest);
    }

    .kpi-value.warn {
      color: var(--warning);
    }

    .kpi-value.danger {
      color: var(--danger);
    }

    .kpi-sub {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Section intro */
    .section-intro {
      background: var(--beige);
      border-left: 4px solid var(--primary);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 18px;
      margin-bottom: 22px;
    }

    .section-intro h2 {
      color: var(--primary);
      margin-bottom: 4px;
      font-family: 'Nunito', sans-serif;
    }

    /* Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      border-top: 3px solid var(--beige);
    }

    .card:hover {
      border-top-color: var(--accent);
      box-shadow: 0 4px 16px rgba(64, 25, 56, .13);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-title {
      font-weight: 700;
      font-size: .9rem;
      font-family: 'Nunito', sans-serif;
    }

    .badge {
      font-size: .7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
      font-family: 'Nunito', sans-serif;
    }

    .badge.ok {
      background: #d4ebe8;
      color: var(--forest);
    }

    .badge.warn {
      background: #fde8df;
      color: var(--warning);
    }

    .badge.danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .badge.info {
      background: var(--primary-light);
      color: var(--primary);
    }

    .card p {
      margin-top: 4px;
      font-size: .82rem;
    }

    .card-hint {
      font-size: .72rem;
      color: var(--accent);
      margin-top: 10px;
      font-weight: 600;
    }

    .card-date {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Progress */
    .progress-wrap {
      margin: 8px 0 4px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .progress-bar {
      height: 8px;
      background: var(--beige);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      transition: width .4s ease;
    }

    .progress-fill.warn {
      background: var(--warning);
    }

    .progress-fill.danger {
      background: var(--danger);
    }

    .progress-fill.ok {
      background: var(--forest);
    }

    /* Detail panel */
    #detail-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-top: 22px;
      box-shadow: var(--shadow);
    }

    #detail-panel.open {
      display: block;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    #close-detail {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: .8rem;
      cursor: pointer;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
    }

    #close-detail:hover {
      background: var(--beige);
    }

    .detail-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
      margin-top: 10px;
    }

    .detail-body th {
      text-align: left;
      font-size: .75rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
    }

    .detail-body td {
      padding: 8px 10px;
      border-bottom: 1px solid #f1f3f8;
      vertical-align: middle;
    }

    .detail-body tr:last-child td {
      border-bottom: none;
    }





    /* AI narrative */
    .ai-narrative {
      background: var(--beige);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 26px;
      font-size: .88rem;
      line-height: 1.85;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
    }

    /* Traffic light */
    .tl-wrap {
      display: flex;
      align-items: center;
      gap: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 24px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .tl-light {
      background: #1c1c1c;
      border-radius: 14px;
      padding: 10px 9px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .tl-bulb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      opacity: .12;
      transition: opacity .2s;
    }

    .tl-bulb.red {
      background: #ef4444;
    }

    .tl-bulb.orange {
      background: #f97316;
    }

    .tl-bulb.green {
      background: #22c55e;
    }

    .tl-bulb.active.red {
      opacity: 1;
      box-shadow: 0 0 12px #ef4444;
    }

    .tl-bulb.active.orange {
      opacity: 1;
      box-shadow: 0 0 12px #f97316;
    }

    .tl-bulb.active.green {
      opacity: 1;
      box-shadow: 0 0 12px #22c55e;
    }

    .tl-text {}

    .tl-status {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .tl-status.red {
      color: #dc2626;
    }

    .tl-status.orange {
      color: #d97706;
    }

    .tl-status.green {
      color: #16a34a;
    }

    .tl-reason {
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Print bar */
    .print-bar {
      background: var(--beige);
      border-bottom: 1px solid var(--border);
      padding: 6px 32px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .print-btn {
      font-size: .78rem;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid rgba(64, 25, 56, .2);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .print-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .print-btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .print-btn.primary:hover {
      background: #5c2550;
    }

    /* Version picker */
    .version-picker {
      display: flex;
      gap: 4px;
    }

    .ver-btn {
      font-size: .75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, .3);
      background: rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .8);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
      font-family: 'Nunito', sans-serif;
    }

    .ver-btn:hover {
      background: rgba(255, 255, 255, .22);
      color: #fff;
      border-color: rgba(255, 255, 255, .6);
    }

    .ver-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }


    /* Print page styles (injected into new window) */
    @media print {

      .print-bar,
      .tab-bar,
      #source-modal-overlay {
        display: none !important;
      }
    }

    /* Overview timeline */
    .timeline-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
      margin-top: 16px;
    }

    .timeline-table th {
      text-align: left;
      font-size: .72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
    }

    .timeline-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f3f8;
    }

    .timeline-table tr:last-child td {
      border-bottom: none;
    }

    .timeline-table tr.sprint-done td {
      background: #edf5f4;
    }

    .timeline-table tr.sprint-active td {
      background: var(--accent-light);
    }

    .sprint-label {
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
    }

    .sprint-label.done {
      color: var(--forest);
    }

    .sprint-label.active {
      color: var(--accent);
    }

    .sprint-label.planned {
      color: var(--muted);
    }

    .sub-label {
      font-size: .78rem;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 20px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media(max-width: 640px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .panel h3 {
      margin-bottom: 12px;
      color: var(--text);
    }

    /* Row source button */
    .row-src-btn { 
      font-size: .65rem; 
      font-weight: 600; 
      padding: 2px 6px; 
      border-radius: 4px; 
      background: var(--beige); 
      border: 1px solid var(--border); 
      color: var(--muted); 
      cursor: pointer; white-space:
      nowrap; 
    }

    .row-src-btn:hover { 
      background: var(--accent-light); 
      color: var(--accent); 
      border-color: var(--accent); 
    }

    /* Section source badges */
    .source-badge { 
      display: inline-block; 
      font-size: .7rem; 
      font-weight: 600; 
      padding: 2px 8px; 
      border-radius: 20px; 
      background: var(--beige); 
      border: 1px solid var(--border); 
      color: var(--muted); 
      cursor: pointer; 
      margin: 2px; 
      transition: background .12s; 
    }

    .source-badge:hover { 
      background: var(--accent-light); 
      color: var(--accent); 
      border-color: var(--accent); 
    }

    .sources-label { 
      font-size: .75rem; 
      color: var(--muted); 
      margin-top: 14px; 
      margin-bottom: 4px; 
    }

    /* Source modal */
    #source-modal-overlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,.35); 
      z-index: 100; 
      align-items: center; 
      justify-content: center; 
    }

    #source-modal-overlay.open  { 
      display: flex; 
    }

    #source-modal { 
      background: var(--surface); 
      border-radius: var(--radius); 
      padding: 28px 32px; 
      max-width: 520px; 
      width: 90%; 
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
    }

    #source-modal h3 { 
      margin-bottom: 6px; 
    }

    #source-modal .source-meta {
      font-size: .78rem; 
      color: var(--muted); 
      margin-bottom: 14px; 
      line-height: 1.8; 
    }
    #source-modal .source-row { 
      padding: 8px 0; 
      border-bottom: 1px solid var(--border); 
      font-size: .85rem; 
    }

    #source-modal .source-row:last-child { 
      border-bottom: none; 
    }
    #source-modal .source-row strong { 
      display: block; 
      font-weight: 600; 
      font-size: .73rem; 
      color: var(--muted); 
      text-transform: uppercase; 
      letter-spacing: .04em; 
    }

    #close-source { 
      margin-top: 18px; 
      background: var(--primary); 
      color: #fff; border: none; 
      border-radius: 6px; 
      padding: 8px 20px; 
      font-size: .85rem; 
      font-weight: 700; 
      cursor: pointer; 
      font-family: 'Nunito', sans-serif; 
    }
    #close-source:hover { background: #5c2550; }
  </style>
</head>

<body>

  <header>
    <div>
      <h1 id="project-title"></h1>
      <div class="header-meta">Report generated: <span id="report-date"></span></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap;">
      <span class="recap-wordmark">RECAP</span>
      <div class="version-picker" id="version-picker">
        <button class="ver-btn active" data-ver="v_generated" data-i18n-ver="ver_generated">Latest Report</button>
      </div>
      <span class="sprint-badge" id="sprint-badge"></span>
    </div>
  </header>

  <div class="print-bar">
    <button class="print-btn" id="btn-print-tab">Download this tab</button>
    <button class="print-btn primary" id="btn-print-all">Download full report</button>
  </div>

  <nav class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="overview" data-i18n="tab_overview">Overview</button>
    <button class="tab-btn" data-tab="time" data-i18n="tab_time">Time &amp; Cost</button>
    <button class="tab-btn" data-tab="features" data-i18n="tab_features">Feature Progress</button>
    <button class="tab-btn" data-tab="dataquality" data-i18n="tab_dataquality">Data Quality</button>
    <button class="tab-btn" data-tab="risks" data-i18n="tab_risks">Risks &amp; Alerts</button>
    <button class="tab-btn" data-tab="quality" data-i18n="tab_quality">Quality</button>
    <button class="tab-btn" data-tab="ai" data-i18n="tab_ai">AI Insights</button>
  </nav>

  <main id="main-content"></main>

  <div style="max-width:1100px;margin:0 auto;padding:0 32px 48px;">
    <div id="detail-panel">
      <div class="detail-header">
        <h2 id="detail-title"></h2>
        <button id="close-detail">✕ Close</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </div>

  <div id="source-modal-overlay">                                                                                                                                                                                
    <div id="source-modal">                                                                                                                                                                                      
      <h3 id="source-modal-title"></h3>                                                                                                                                                                          
      <div class="source-meta" id="source-modal-meta"></div>                                                                                                                                                     
      <div id="source-modal-body"></div>                                                                                                                                                                         
      <button id="close-source">Close</button>                                                                                                                                                                   
    </div>                                                                                                                                                                                                       
  </div>

        return `<div class="card" data-card="${c.id}">
      <div class="card-header">
        <div class="card-title">${title}</div>
        <span class="badge ${c.badge}">${c.badgeText}</span>
      </div>
      ${c.date ? `<div class="card-date">${c.date}</div>` : ''}
      <p>${summary}</p>
      <div class="card-hint">${t('card_hint')}</div>
    </div>`;
      }

      let allCards = [];
      function rebuildAllCards() {
        allCards = [
          ...(DATA.overview.cards || []),
          ...(DATA.time.cards || []),
          ...(DATA.features.cards || []),
          ...(DATA.dataquality.cards || []),
          ...(DATA.risks.cards || []),
          ...(DATA.quality.cards || []),
        ];
      }
      rebuildAllCards();

      /* ═══════════════════════════════════════════════
         TAB RENDERERS
      ═══════════════════════════════════════════════ */
      const tabs = {

        overview() {
          const d = DATA.overview;
          return `
        <div class="section-intro"><h2>${t('intro_overview_h')}</h2>
          <p>${t('intro_overview_p')}</p>
        </div>
        ${trafficLight(...DATA.meta.trafficLight)}
        ${kpis(d.kpis || [])}

        <div class="two-col" style="margin-top: 16px;">
          <div class="panel">
            <h3 style="font-family:'Nunito',sans-serif;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;">Budget Burn Rate</h3>
            <div style="position:relative;height:200px;"><canvas id="budget-chart"></canvas></div>
          </div>
          <div class="panel">
            <h3 style="font-family:'Nunito',sans-serif;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;">Feature Progress</h3>
            <div style="position:relative;height:200px;"><canvas id="progress-chart"></canvas></div>
          </div>
        </div>

        <div class="cards-grid" style="margin-top: 24px;">${(d.cards || []).map(cardHTML).join('')}</div>
        <p style="margin-top:28px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--border);padding-top:16px;">${t('overview_note')}</p>`;
        },

        time() {
          const d = DATA.time;
          return `<div class="section-intro"><h2>${t('intro_time_h')}</h2>
        <p>${t('intro_time_p')}</p></div>
        ${kpis(d.kpis)}
        <div class="cards-grid">${d.cards.map(cardHTML).join('')}</div>`;
        },

        features() {
          const d = DATA.features;
          const fp = featPct(d.kpis);
          const hp = hoursPct(d.kpis);
          const featBar = (() => {
            if (!fp) return `<p style="color:var(--muted);font-size:.82rem;margin:8px 0 16px;">No feature completion data available.</p>`;
            const status = fp.pct >= 70 ? 'ok' : fp.pct >= 40 ? 'warn' : 'danger';
            const label = `Features done — ${fp.done} of ${fp.total} features complete`;
            return progress(fp.pct, status, label);
          })();
          const hoursBar = (() => {
            if (!hp) return '';
            const status = hp.pct <= 100 ? 'ok' : 'warn';
            const label = `Hours logged — ${hp.actual}h of ${hp.estimated}h estimated`;
            return `<div style="margin-top:10px;">${progress(hp.pct, status, label)}</div>`;
          })();
          return `<div class="section-intro"><h2>${t('intro_features_h')}</h2>
        <p>${t('intro_features_p')}</p></div>
        ${kpis(d.kpis)}
        ${featBar}
        ${hoursBar}
        <p class="sub-label" style="margin-top:5px;">${fp ? `${fp.done} of ${fp.total} features marked complete.${hp ? ` ${hp.actual}h logged out of ${hp.estimated}h estimated.` : ''}` : 'Feature data not yet available for this sprint.'}</p>
        <div class="cards-grid">${d.cards.map(cardHTML).join('')}</div>`;
        },

        dataquality() {
          const d = DATA.dataquality;
          return `<div class="section-intro"><h2>${t('intro_dataquality_h')}</h2>
        <p>${t('intro_dataquality_p')}</p></div>
        ${kpis(d.kpis)}
        <div class="cards-grid">${d.cards.map(cardHTML).join('')}</div>`;
        },

        risks() {
          const d = DATA.risks;
          return `<div class="section-intro"><h2>${t('intro_risks_h')}</h2>
        <p>${t('intro_risks_p')}</p></div>
        ${kpis(d.kpis)}
        <div class="cards-grid">${d.cards.map(cardHTML).join('')}</div>`;
        },

        quality() {
          const d = DATA.quality;
          const cvgKpi = d.kpis.find(k => k.label === 'Test coverage');
          const cvgPct = cvgKpi ? parseInt(cvgKpi.value) : 64;
          const cvgStatus = cvgKpi ? cvgKpi.status : 'warn';
          return `<div class="section-intro"><h2>${t('intro_quality_h')}</h2>
        <p>${t('intro_quality_p')}</p></div>
        ${kpis(d.kpis)}
        ${progress(cvgPct, cvgStatus, `${t('Test coverage')} (target 80 %)`)}
        <p class="sub-label" style="margin-top:5px;margin-bottom:18px;">Overall test coverage as of latest sprint</p>
        <div class="cards-grid">${d.cards.map(cardHTML).join('')}</div>`;
        },

        ai() {                                                                                                                                                                                                         
          const d = DATA.ai;                                                                                                                                                                                         
          const narrative = d.narrative;                                                                                                                                                                             
          return `<div class="section-intro"><h2>${t('intro_ai_h')}</h2>                                          
          <p>${t('intro_ai_p')}</p></div>           
          ${kpis(d.kpis)}                       
          <div class="ai-narrative">${narrative}</div>                                                                                                                                                                 
          ${sourcesBlock(d.sources_used)}`;                                                                                                                                                                            
        }, 
      };

      /* ═══════════════════════════════════════════════
         INTERACTIONS
      ═══════════════════════════════════════════════ */


      function openSource(id) {
        const s = DATA.sources ? DATA.sources[id] : null;
        if (!s) {
          document.getElementById('source-modal-title').textContent = id || 'Source';
          document.getElementById('source-modal-meta').innerHTML = `<strong>Source:</strong> ${id}<br/><strong>Type:</strong> Jira ticket referenced in analysis`;
          document.getElementById('source-modal-body').innerHTML = `<div class="source-row"><strong>Ticket</strong>${id}</div>`;
          document.getElementById('source-modal-overlay').classList.add('open');
          return;
        }
        document.getElementById('source-modal-title').textContent = s.name;
        document.getElementById('source-modal-meta').innerHTML =
          `<strong>Tool:</strong> ${s.tool}<br/><strong>Location:</strong> ${s.location}<br/><strong>Accessed:</strong> ${s.accessed}`;
        document.getElementById('source-modal-body').innerHTML =
          s.rows.map(r => `<div class="source-row"><strong>${r.field}</strong>${r.value}</div>`).join('');
        document.getElementById('source-modal-overlay').classList.add('open');
      }                                                                                                                                                                                                              
                                                                                                                                                                                                                 
      function attachHandlers() {                                                                                                                                                                                    
        // Card click → detail panel                                                                                                                                                                               
        document.querySelectorAll('.card').forEach(el => {                                                                                                                                                         
          el.addEventListener('click', () => {                                                                                                                                                                     
            const c = allCards.find(x => x.id === el.dataset.card);                                                                                                                                                
            if (!c) return;                                                                                                                                                                                        
            document.getElementById('detail-title').textContent = c.title;                                                                                                                                         
            document.getElementById('detail-body').innerHTML =
              `${c.detail ? `<p style="margin-bottom:14px;color:var(--muted);">${c.detail.intro}</p>` : ''}
             ${c.detail && c.detail.table ? renderTable(c.detail.table) : ''}
             ${sourcesBlock(c.sources || [])}`;
            const panel = document.getElementById('detail-panel');                                                                                                                                                 
            panel.classList.add('open');                                                                                                                                                                           
            panel.querySelectorAll('.source-badge, .row-src-btn').forEach(b => {                                                                                                                                   
              b.addEventListener('click', e => { e.stopPropagation(); openSource(b.dataset.source); });                                                                                                            
            });                                                                                                                                                                                                    
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });                                                                                                                                        
          });                                                                                                                                                                                                      
      });                                                                                                                                                                                                        
                                                                                                                                                                                                                 
      // Section-level source badges                                                                                                                                                                             
      document.querySelectorAll('#main-content .source-badge').forEach(b => {                                                                                                                                    
        b.addEventListener('click', () => openSource(b.dataset.source));                                                                                                                                         
      });                                                                                                                                                                                                        
  }                            

      function renderTab(name) {
        currentTab = name;
        document.getElementById('main-content').innerHTML = tabs[name]();
        document.getElementById('detail-panel').classList.remove('open');
        attachHandlers();

        if (name === 'overview') {
          setTimeout(renderOverviewCharts, 50); // slight delay to ensure canvas is in DOM
        }
      }

      function renderOverviewCharts() {
        if (!window.Chart) return;

        // 1. Budget Data Extraction
        let budgetUsed = 165;
        let budgetTotal = 200;
        let burnKpi = null;

        if (DATA.time && DATA.time.kpis) burnKpi = DATA.time.kpis.find(k => k.label.includes('Burn') || k.label.includes('Budget'));
        if (!burnKpi && DATA.overview && DATA.overview.kpis) burnKpi = DATA.overview.kpis.find(k => k.label.includes('Burn') || k.label.includes('Budget'));

        if (burnKpi && burnKpi.sub) {
          const nums = burnKpi.sub.match(/\d+/g);
          if (nums && nums.length >= 2) {
            budgetUsed = parseInt(nums[0]);
            budgetTotal = parseInt(nums[1]);
          }
        }
        let budgetRemaining = Math.max(0, budgetTotal - budgetUsed);

        const ctxBudget = document.getElementById('budget-chart');
        if (ctxBudget) {
          new Chart(ctxBudget, {
            type: 'doughnut',
            data: {
              labels: ['Used (h)', 'Remaining (h)'],
              datasets: [{
                data: [budgetUsed, budgetRemaining],
                backgroundColor: ['#f58962', '#e1d1c1'],
                borderWidth: 0,
                hoverOffset: 4
              }]
            },
            options: {
              maintainAspectRatio: false,
              cutout: '75%',
              plugins: {
                legend: { position: 'bottom', labels: { font: { family: "'DM Sans', sans-serif", size: 11 } } }
              }
            }
          });
        }

        // 2. Feature Data Extraction
        let featDone = 4, featWip = 2, featPlan = 8;
        if (DATA.features && DATA.features.kpis) {
          const kDone = DATA.features.kpis.find(k => k.label.toLowerCase().includes('complete') || k.label.toLowerCase().includes('done'));
          if (kDone) { const m = kDone.value.match(/\d+/); if (m) featDone = parseInt(m[0]); }
          const kWip = DATA.features.kpis.find(k => k.label.toLowerCase().includes('progress') || k.label.toLowerCase().includes('wip'));
          if (kWip) { const m = kWip.value.match(/\d+/); if (m) featWip = parseInt(m[0]); }
          const kPlan = DATA.features.kpis.find(k => k.label.toLowerCase().includes('planned'));
          if (kPlan) { const m = kPlan.value.match(/\d+/); if (m) featPlan = parseInt(m[0]); }
        }

        const ctxProgress = document.getElementById('progress-chart');
        if (ctxProgress) {
          new Chart(ctxProgress, {
            type: 'bar',
            data: {
              labels: ['Done', 'In Progress', 'Planned'],
              datasets: [{
                data: [featDone, featWip, featPlan],
                backgroundColor: ['#193837', '#f58962', '#e1d1c1'],
                borderRadius: 6,
                barPercentage: 0.6
              }]
            },
            options: {
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { beginAtZero: true, grid: { color: '#f1f3f8' }, border: { display: false }, ticks: { precision: 0, font: { family: "'DM Sans', sans-serif" } } },
                x: { grid: { display: false }, border: { display: false }, ticks: { font: { family: "'DM Sans', sans-serif" } } }
              }
            }
          });
        }
      }

      /* ═══════════════════════════════════════════════
         PRINT GENERATION
      ═══════════════════════════════════════════════ */
      const TAB_META = [
        { key: 'overview', title: '📊 Overview', data: () => DATA.overview },
        { key: 'time', title: '⏱ Time & Cost', data: () => DATA.time },
        { key: 'features', title: '📋 Feature Progress', data: () => DATA.features },
        { key: 'dataquality', title: '🔍 Data Quality', data: () => DATA.dataquality },
        { key: 'risks', title: '⚠️ Risks & Alerts', data: () => DATA.risks },
        { key: 'quality', title: '🔬 Quality', data: () => DATA.quality },
        { key: 'ai', title: '🤖 AI Insights', data: () => DATA.ai },
      ];

      function trafficLight(status, label, reason) {
        // status: 'green' | 'orange' | 'red'
        return `<div class="tl-wrap">
      <div class="tl-light">
        <div class="tl-bulb red    ${status === 'red' ? 'active' : ''}"></div>
        <div class="tl-bulb orange ${status === 'orange' ? 'active' : ''}"></div>
        <div class="tl-bulb green  ${status === 'green' ? 'active' : ''}"></div>
      </div>
      <div class="tl-text">
        <div class="tl-status ${status}">${label}</div>
        <div class="tl-reason">${reason}</div>
      </div>
    </div>`;
      }

      function printTable_static(t) {
        const hasRowSrc = t.rows.some(r => r.cells);
        const thead = `<thead><tr>${t.headers.map(h => `<th>${h}</th>`).join('')}${hasRowSrc ? '<th>Source</th>' : ''}</tr></thead>`;
        const tbody = `<tbody>${t.rows.map(r => {
          const cells = r.cells || r;
          const src = r.source;
          const srcText = hasRowSrc ? `<td style="font-size:.72rem;color:#888;">${src && DATA.sources[src] ? DATA.sources[src].tool.split(' ')[0] : (src || '')}</td>` : '';
          return `<tr>${cells.map(c => `<td>${c}</td>`).join('')}${srcText}</tr>`;
        }).join('')}</tbody>`;
        return `<table>${thead}${tbody}</table>`;
      }

      function printCard(c) {
        const srcNames = (c.sources || []).map(id => DATA.sources[id] ? DATA.sources[id].name : id).join(' &nbsp;·&nbsp; ');
        return `<div class="pc">
      <div class="pc-head">
        <strong>${c.title}</strong>
        <span class="pb pb-${c.badge}">${c.badgeText}</span>
      </div>
      ${c.date ? `<div class="pc-date">${c.date}</div>` : ''}
      <p class="pc-sum">${c.summary}</p>
      ${c.detail ? `<p class="pc-intro">${c.detail.intro}</p>` : ''}
      ${c.detail && c.detail.table ? printTable_static(c.detail.table) : ''}
      <div class="pc-src">Sources: ${srcNames}</div>
    </div>`;
      }

      function printKpisStatic(list) {
        return `<div class="pk-row">${list.map(k => `<div class="pk"><div class="pk-label">${k.label}</div><div class="pk-val pk-${k.status}">${k.value}</div><div class="pk-sub">${k.sub}</div></div>`).join('')}</div>`;
      }

      function printSection(meta) {
        const d = meta.data();
        const cards = d.cards || [];
        // Special handling for AI tab (narrative, no cards)
        if (meta.key === 'ai') {
          const srcNames = d.sources_used.map(id => DATA.sources[id] ? DATA.sources[id].name : id).join(' &nbsp;·&nbsp; ');
          return `<section class="psec">
        <h2>${meta.title}</h2>
        ${printKpisStatic(d.kpis)}
        <div class="pc-intro" style="margin-top:12px;">${d.narrative}</div>
        <div class="pc-src" style="margin-top:16px;">Sources: ${srcNames}</div>
      </section>`;
        }
        return `<section class="psec">
      <h2>${meta.title}</h2>
      ${printKpisStatic(d.kpis)}
      ${cards.map(printCard).join('')}
    </section>`;
      }

      const PRINT_CSS = `
    body { font-family: Arial, sans-serif; font-size: 12px; color: #1e293b; margin: 0; padding: 0; }
    h1   { font-size: 18px; margin-bottom: 2px; }
    h2   { font-size: 14px; margin: 24px 0 10px; border-bottom: 2px solid #2563eb; padding-bottom: 4px; color: #2563eb; }
    p    { color: #475569; margin: 4px 0; line-height: 1.5; }
    .report-header { padding: 16px 24px; border-bottom: 2px solid #e2e6ee; margin-bottom: 16px; }
    .report-meta   { font-size: 11px; color: #64748b; margin-top: 3px; }
    .psec   { padding: 0 24px 8px; page-break-after: always; }
    .psec:last-child { page-break-after: avoid; }
    .pk-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .pk     { border: 1px solid #e2e6ee; border-radius: 6px; padding: 10px 14px; min-width: 130px; }
    .pk-label { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
    .pk-val   { font-size: 18px; font-weight: 700; }
    .pk-sub   { font-size: 9px; color: #64748b; margin-top: 1px; }
    .pk-ok     { color: #16a34a; }
    .pk-warn   { color: #d97706; }
    .pk-danger { color: #dc2626; }
    .pc     { border: 1px solid #e2e6ee; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; break-inside: avoid; }
    .pc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .pc-head strong { font-size: 12px; }
    .pc-date { font-size: 10px; color: #64748b; margin-bottom: 4px; }
    .pc-sum  { font-size: 11px; color: #475569; margin-bottom: 8px; }
    .pc-intro { font-size: 11px; color: #475569; margin-bottom: 8px; }
    .pc-src  { font-size: 9px; color: #94a3b8; margin-top: 10px; border-top: 1px solid #f1f5f9; padding-top: 6px; }
    .pb      { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
    .pb-ok     { background: #dcfce7; color: #16a34a; }
    .pb-warn   { background: #fef9c3; color: #d97706; }
    .pb-danger { background: #fee2e2; color: #dc2626; }
    .pb-info   { background: #eff4ff; color: #2563eb; }
    table  { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 8px; }
    th     { text-align: left; font-size: 9px; color: #64748b; border-bottom: 1px solid #e2e6ee; padding: 4px 8px; }
    td     { padding: 5px 8px; border-bottom: 1px solid #f8fafc; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    @media print { @page { margin: 15mm; } }
  `;

      function openPrintWindow(sections) {
        const header = `<div class="report-header">
      <h1>${DATA.meta.projectName || 'Project Report'}</h1>
      <div class="report-meta">Report generated: ${DATA.meta.reportDate || ''} &nbsp;·&nbsp; ${DATA.meta.sprintBadge || ''}</div>
    </div>`;
        const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Cooperon AB — Project Status Report</title><style>${PRINT_CSS}</style></head><body>${header}${sections}</body></html>`;
        const w = window.open('', '_blank');
        w.document.write(html);
        w.document.close();
        w.focus();
        setTimeout(() => w.print(), 400);
      }

      /* ═══════════════════════════════════════════════
         WIRE-UP
      ═══════════════════════════════════════════════ */
      function applyI18n() {
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-ver]').forEach(el => { el.textContent = t(el.dataset.i18nVer); });
        document.getElementById('btn-print-tab').textContent = t('btn_print_tab');
        document.getElementById('btn-print-all').textContent = t('btn_print_all');
      }

      document.querySelectorAll('.ver-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.ver-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          DATA = VERSIONS[btn.dataset.ver];
          initHeader();
          rebuildAllCards();
          renderTab(currentTab);
        });
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderTab(btn.dataset.tab);
        });
      });

      document.getElementById('close-detail').addEventListener('click', () => {
        document.getElementById('detail-panel').classList.remove('open');
      });
      document.getElementById('close-source').addEventListener('click', () => {
      document.getElementById('source-modal-overlay').classList.remove('open');
      });



      let currentTab = 'overview';

      document.getElementById('btn-print-tab').addEventListener('click', () => {
        const meta = TAB_META.find(t => t.key === currentTab);
        if (meta) openPrintWindow(printSection(meta));
      });

      document.getElementById('btn-print-all').addEventListener('click', () => {
        openPrintWindow(TAB_META.map(printSection).join(''));
      });

      function initHeader() {
        if (!DATA || !DATA.meta) return;
        if (DATA.meta.projectName) document.getElementById('project-title').textContent = DATA.meta.projectName;
        if (DATA.meta.reportDate) document.getElementById('report-date').textContent = DATA.meta.reportDate;
        if (DATA.meta.sprintBadge) document.getElementById('sprint-badge').textContent = DATA.meta.sprintBadge;
      }

      initHeader();
      renderTab('overview');
    })();
  </script>
</body>

</html>
